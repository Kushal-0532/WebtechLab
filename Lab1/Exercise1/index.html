<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
        }
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Student Marksheet</h1>
    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Subject 1</th>
                <th>Subject 2</th>
                <th>Subject 3</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Student A</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
                <td>263</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Student B</td>
                <td>92</td>
                <td>87</td>
                <td>91</td>
                <td>270</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Student C</td>
                <td>78</td>
                <td>82</td>
                <td>80</td>
                <td>240</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Student D</td>
                <td>88</td>
                <td>93</td>
                <td>89</td>
                <td>270</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Student E</td>
                <td>81</td>
                <td>85</td>
                <td>83</td>
                <td>249</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
