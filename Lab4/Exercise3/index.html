<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Student Management System</h1>
      <p class="subtitle">AJAX CRUD Operations</p>
    </header>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Student Form -->
    <section class="form-section">
      <h2 id="form-title">Add New Student</h2>
      <form id="student-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" placeholder="e.g., STU001" required>
          </div>
          <div class="form-group">
            <label for="studentName">Name</label>
            <input type="text" id="studentName" name="studentName" placeholder="Enter full name" required>
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" required>
              <option value="">Select Department</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Electronics">Electronics</option>
              <option value="Mechanical">Mechanical</option>
              <option value="Civil">Civil</option>
              <option value="Electrical">Electrical</option>
            </select>
          </div>
          <div class="form-group">
            <label for="marks">Marks</label>
            <input type="number" id="marks" name="marks" min="0" max="100" placeholder="0-100" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            <span class="btn-text">Add Student</span>
          </button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">
            Cancel
          </button>
        </div>
      </form>
    </section>

    <!-- Students Table -->
    <section class="table-section">
      <div class="table-header">
        <h2>Student Records</h2>
        <button id="refresh-btn" class="btn btn-outline" title="Refresh Data">
          ↻ Refresh
        </button>
      </div>
      <div class="table-wrapper">
        <table id="students-table">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Marks</th>
              <th>Grade</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="students-tbody">
            <!-- Student rows will be dynamically inserted here -->
          </tbody>
        </table>
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <span>Loading students...</span>
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
          <p>No students found. Add your first student above!</p>
        </div>
      </div>
    </section>

    <footer>
      <p>Lab 4 - Exercise 3 | AJAX CRUD Operations</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
